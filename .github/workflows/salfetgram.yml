name: SalfetGram arm64

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'

concurrency:
  group: sg-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build arm64 release
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "5G"
      CCACHE_HARDLINK: "true"
      NATIVE_TARGET: "arm64-v8a"
      NDK_VERSION: "27.2.12479018"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: |
          SDKM=$(command -v sdkmanager || true)
          if [ -z "$SDKM" ]; then
            SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          fi
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" \
            "cmake;3.22.1" "ndk;${NDK_VERSION}" 2>&1 | tail -3
          ls "$ANDROID_HOME/ndk"

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: native-arm64
          max-size: 5G

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Configure keys, signing and sdk
        run: |
          # keep the committed keystore if its password still works, else make a fresh one
          if ! keytool -list -keystore TMessagesProj/release.keystore -storepass android -alias androidkey > /dev/null 2>&1; then
            echo "committed keystore unusable, generating a new one"
            rm -f TMessagesProj/release.keystore
            keytool -genkeypair -v \
              -keystore TMessagesProj/release.keystore \
              -storepass android -keypass android -alias androidkey \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=SalfetGram, OU=SalfetGram, O=SalfetGram, L=Moscow, C=RU"
          fi
          {
            echo "sdk.dir=${ANDROID_HOME}"
            echo "ndk.dir=${ANDROID_HOME}/ndk/${NDK_VERSION}"
            echo "TELEGRAM_APP_ID=4"
            echo "TELEGRAM_APP_HASH=014b35b6184100b085b0d0572f9b5103"
            echo "KEYSTORE_PASS=android"
            echo "ALIAS_NAME=androidkey"
            echo "ALIAS_PASS=android"
          } > local.properties
          sed -i "s/2000000000000/$(date +%s%N | cut -c1-13)/g" gradle.properties
          sed -i 's/xyz\.nextalone\.nagram/com.salfetgram.messenger/' TMessagesProj/google-services.json
          cat local.properties
          grep -n 'package_name' TMessagesProj/google-services.json
          chmod +x gradlew
          # the native lib hard-codes the sha1 of the signing certificate and
          # aborts JNI_OnLoad on mismatch, so bake in our own fingerprint
          CERT_SHA1=$(keytool -exportcert -alias androidkey -keystore TMessagesProj/release.keystore -storepass android 2>/dev/null | openssl dgst -sha1 -r | cut -d' ' -f1 | tr 'a-f' 'A-F')
          echo "CERT_SHA1=${CERT_SHA1}"
          if [ -n "${CERT_SHA1}" ]; then
            sed -i "s/3A0F57FE06485D0B90D0ACD990E3A30328E3988D/${CERT_SHA1}/" TMessagesProj/jni/integrity/integrity.cpp
            grep -n 'SIGN =' TMessagesProj/jni/integrity/integrity.cpp
          fi

      - name: Build
        run: |
          ./gradlew TMessagesProj:assembleRelease --no-daemon --stacktrace
          find TMessagesProj/build/outputs/apk -name '*.apk' -printf '%p %s bytes\n'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SalfetGram-arm64
          path: TMessagesProj/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload keystore
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signing-keystore
          path: TMessagesProj/release.keystore
          if-no-files-found: warn